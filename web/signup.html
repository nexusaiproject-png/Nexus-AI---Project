<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Create your Nexus workspace</h1><p>Start with the free plan.</p><form id="signup"><label>Name<br><input id="name" required></label><br><label>Email<br><input id="email" type="email" required></label><br><label>Password<br><input id="password" type="password" minlength="8" required></label><br><button class="button" type="submit">Create account</button></form><p id="message" role="status"></p><p><a href="/web/login.html">Already have an account?</a></p></section></main><script>document.getElementById('signup').onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});const d=await r.json();if(!r.ok){message.textContent=d.detail||'Signup failed';return}message.textContent='Account created. Check your verification email, then log in.';location.href='/web/verify.html'};</script></body></html>
