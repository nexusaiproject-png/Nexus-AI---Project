<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Verify your email</h1><p>Paste the verification token from your email.</p><form id="verify"><label>Verification token<br><input id="token" required></label><br><button class="button">Verify email</button></form><p id="message" role="status"></p><p><a href="/web/login.html">Continue to login</a></p></section></main><script>document.getElementById('verify').onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value})});const d=await r.json();message.textContent=r.ok?'Email verified. You can log in.':(d.detail||'Verification failed');};</script></body></html>
