<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Billing</h1><p>Manage your Nexus AI subscription.</p><div id="plans"></div><p id="message" role="status"></p></section></main><script>const message=document.getElementById('message');async function load(){const r=await fetch('/billing/plans');const d=await r.json();document.getElementById('plans').innerHTML=d.plans.map(p=>p.key==='free'?`<article><h2>${p.name}</h2><p>$${p.monthly_usd}/month</p></article>`:`<article><h2>${p.name}</h2><p>$${p.monthly_usd}/month</p><button class="button" onclick="checkout('${p.key}')">Subscribe</button></article>`).join('');}async function checkout(plan){const r=await fetch('/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});const d=await r.json();if(!r.ok){message.textContent=d.detail||'Checkout unavailable';return}location.href=d.checkout_url;}load();</script></body></html>
