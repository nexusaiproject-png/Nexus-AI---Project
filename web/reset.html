<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password reset — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Reset your password</h1><p>Request a reset link from your configured email service.</p><form id="request"><label>Email<br><input id="email" type="email" required></label><br><button class="button">Request reset</button></form><p id="message" role="status"></p><hr><form id="confirm"><label>Reset token<br><input id="token" required></label><br><label>New password<br><input id="password" type="password" minlength="8" required></label><br><button class="button">Set new password</button></form></section></main><script>request.onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});message.textContent=r.ok?'If the account exists, reset instructions will be sent.':'Request failed'};confirm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value,password:password.value})});message.textContent=r.ok?'Password reset. You can log in.':'Reset failed'};</script></body></html>
