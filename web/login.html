<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Log in</h1><p>Sign in to your Nexus workspace.</p><form id="login"><label>Email<br><input id="email" type="email" required></label><br><label>Password<br><input id="password" type="password" required></label><br><button class="button" type="submit">Log in</button></form><p id="message" role="status"></p><p><a href="/web/signup.html">Create an account</a></p><p><a href="/web/reset.html">Forgot your password?</a></p></section></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){message.textContent=d.detail||'Login failed';return}location.href='/web/onboarding.html'};</script></body></html>
