<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding — Nexus AI</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><section><h1>Set up your workspace</h1><p>Give your workspace a name and tell Nexus what you want to accomplish.</p><form id="onboarding"><label>Workspace name<br><input id="workspace" required></label><br><label>What do you want to use Nexus for?<br><input id="purpose"></label><br><button class="button" type="submit">Finish setup</button></form><p id="message" role="status"></p></section></main><script>document.getElementById('onboarding').onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/workspace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:workspace.value,purpose:purpose.value||null})});let d=await r.json();if(!r.ok){message.textContent=d.detail||'Workspace creation failed';return}r=await fetch('/auth/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose:purpose.value||null})});d=await r.json();if(!r.ok){message.textContent=d.detail||'Onboarding failed';return}location.href='/ui'};</script></body></html>
